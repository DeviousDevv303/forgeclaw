name: Code Review

# Code review with a 4-bit DeepSeek-Coder-6.7B-Instruct GGUF on llama.cpp (see .github/scripts/review_code.py).
# The previous version loaded a full-precision 7B model (~28 GB) on a 16 GB runner and was killed.
# Failures are printed as ::error:: annotations. Result artifact: code-review-<invocation_id> (1 day).
on:
  workflow_dispatch:
    inputs:
      code_content:
        description: 'Code to review'
        required: true
      language:
        description: 'Programming language'
        default: 'typescript'
      invocation_id:
        description: 'Unique ID'
        required: true

run-name: Code Review ${{ inputs.invocation_id }}

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore review model cache
        id: gguf_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/forgeclaw-review-gguf
          key: review-gguf-v1-${{ runner.os }}
      - name: Install deps (exact pins; prebuilt CPU wheel, no compiling)
        run: |
          pip install huggingface_hub==1.33.0
          pip install llama-cpp-python==0.3.36 --only-binary=llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Review code
        env:
          CODE: ${{ inputs.code_content }}
          REVIEW_LANGUAGE: ${{ inputs.language }}
        run: python .github/scripts/review_code.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-review-${{ inputs.invocation_id }}
          path: |
            review.txt
            review_meta.txt
          if-no-files-found: ignore
          retention-days: 1
      - name: Check model file is present
        id: gguf_present
        if: ${{ steps.gguf_cache.outputs.cache-hit != 'true' }}
        run: |
          if ls ~/.cache/forgeclaw-review-gguf/*.gguf >/dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Save review model cache
        if: ${{ steps.gguf_cache.outputs.cache-hit != 'true' && steps.gguf_present.outputs.present == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/forgeclaw-review-gguf
          key: review-gguf-v1-${{ runner.os }}
