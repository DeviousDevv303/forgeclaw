name: Deep Research

# run-name carries the caller's correlation ID (workflow_dispatch returns no run ID).
run-name: Deep research ${{ inputs.invocation_id }}

# Gathers web evidence server-side (search + page fetch + main-text extraction) for ForgeClaw's
# deep_research tool. The browser cannot read most pages (CORS), so this runs here. It only gathers
# evidence; the selected model writes the answer and cites the numbered sources.
on:
  workflow_dispatch:
    inputs:
      question:
        description: 'Research question'
        required: true
        type: string
      queries:
        description: 'Search queries, one per line (max 6); empty uses the question'
        required: false
        default: ''
        type: string
      max_sources:
        description: 'Maximum sources to fetch (1-15)'
        required: false
        default: '8'
        type: string
      invocation_id:
        description: 'Caller correlation ID'
        required: true
        type: string
      mirror:
        description: "Publish to the browsable research-results branch ('false' for public-visitor runs from the relay)"
        required: false
        default: 'true'
        type: string

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate invocation ID
        env:
          INVOCATION_ID: ${{ inputs.invocation_id }}
        run: |
          printf '%s' "$INVOCATION_ID" | grep -Eqx '[A-Za-z0-9._-]{1,120}' || { echo "::error title=deep-research::invalid invocation_id"; exit 1; }

      - uses: actions/checkout@v4
        with:
          # Untrusted web pages are parsed below; no write credential is left in .git/config.
          # The mirror push authenticates explicitly with the job token instead.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned research dependencies
        run: python -m pip install ddgs==9.16.0 trafilatura==2.3.1 httpx==0.28.1

      - name: Gather evidence
        env:
          QUESTION: ${{ inputs.question }}
          QUERIES: ${{ inputs.queries }}
          MAX_SOURCES: ${{ inputs.max_sources }}
          INVOCATION_ID: ${{ inputs.invocation_id }}
        run: python .github/scripts/deep_research.py

      - name: Publish browser-readable result mirror
        # Public-visitor runs (relay/worker.js) skip the browsable branch; the relay reads the artifact.
        if: ${{ always() && inputs.mirror != 'false' }}
        env:
          INVOCATION_ID: ${{ inputs.invocation_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f research.json ]; then echo "::warning::no research.json to mirror"; exit 0; fi
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git() { command git -c "http.https://github.com/.extraheader=$AUTH" "$@"; }
          git config user.name 'ForgeClaw Research'
          git config user.email 'forgeclaw-research@local'
          git fetch origin research-results || true
          WT="$RUNNER_TEMP/research-worktree"
          if git show-ref --verify --quiet refs/remotes/origin/research-results; then
            git worktree add "$WT" origin/research-results
            git -C "$WT" checkout -B research-results
          else
            git worktree add --detach "$WT" HEAD
            git -C "$WT" checkout --orphan research-results
            git -C "$WT" rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "$WT/research-results"
          cp research.json "$WT/research-results/${INVOCATION_ID}.json"
          git -C "$WT" add "research-results/${INVOCATION_ID}.json"
          git -C "$WT" commit -m "research: ${INVOCATION_ID}"
          for attempt in 1 2 3 4; do
            if git -C "$WT" push origin HEAD:research-results; then break; fi
            if [ "$attempt" = 4 ]; then echo "::warning::mirror push failed after 4 attempts; the artifact remains"; exit 1; fi
            git -C "$WT" fetch origin research-results
            git -C "$WT" rebase origin/research-results
            sleep $((attempt * 2))
          done

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ inputs.invocation_id }}
          path: research.json
          if-no-files-found: warn
          retention-days: 7
