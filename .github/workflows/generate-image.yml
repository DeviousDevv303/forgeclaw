# Repository-owned image generation. Stable Diffusion 1.5 is public and CPU-compatible,
# so this workflow does not require HF_TOKEN or gated model approval.
name: Generate Image
run-name: Generate Image ${{ inputs.invocation_id }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Image description
        required: true
        type: string
      style:
        description: Style such as realistic, artistic, or cartoon
        required: false
        default: realistic
        type: string
      width:
        description: Width in pixels; must be 256-1024 and divisible by 8
        required: false
        default: '512'
        type: string
      height:
        description: Height in pixels; must be 256-1024 and divisible by 8
        required: false
        default: '512'
        type: string
      invocation_id:
        description: Correlation identifier
        required: true
        type: string
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: sd-v15-${{ runner.os }}-${{ hashFiles('.github/workflows/generate-image.yml') }}
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install diffusers transformers accelerate safetensors
      - name: Generate image
        env:
          PROMPT: ${{ inputs.prompt }}
          STYLE: ${{ inputs.style }}
          WIDTH: ${{ inputs.width }}
          HEIGHT: ${{ inputs.height }}
          INVOCATION_ID: ${{ inputs.invocation_id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import torch
          from diffusers import DPMSolverMultistepScheduler, StableDiffusionPipeline

          prompt = os.environ['PROMPT'].strip()
          style = os.environ.get('STYLE', 'realistic').strip() or 'realistic'
          width = int(os.environ.get('WIDTH', '512'))
          height = int(os.environ.get('HEIGHT', '512'))
          if not prompt or len(prompt) > 4000:
              raise SystemExit('prompt must contain 1-4000 characters')
          if not (256 <= width <= 1024 and 256 <= height <= 1024):
              raise SystemExit('width and height must be between 256 and 1024')
          if width % 8 or height % 8:
              raise SystemExit('width and height must be divisible by 8')

          model_id = 'runwayml/stable-diffusion-v1-5'
          print(f'Loading public CPU model: {model_id}')
          torch.set_num_threads(min(4, os.cpu_count() or 1))
          pipe = StableDiffusionPipeline.from_pretrained(
              model_id,
              torch_dtype=torch.float32,
              use_safetensors=True,
          )
          pipe.scheduler = DPMSolverMultistepScheduler.from_config(pipe.scheduler.config)
          pipe.enable_attention_slicing()
          generation_prompt = f'{prompt}, {style} style, high quality, detailed'
          negative_prompt = 'blurry, low quality, distorted, deformed, ugly, watermark, signature'
          print(f'Generating {width}x{height}: {generation_prompt}')
          image = pipe(
              prompt=generation_prompt,
              negative_prompt=negative_prompt,
              width=width,
              height=height,
              num_inference_steps=30,
              guidance_scale=7.5,
          ).images[0]

          output_path = Path(f'generated_{width}x{height}.png')
          image.save(output_path)
          Path('generation_metadata.txt').write_text(
              f'Prompt: {prompt}\nStyle: {style}\nSize: {width}x{height}\n'
              f'Model: {model_id}\nSteps: 30\nGuidance Scale: 7.5\n'
              f'Invocation: {os.environ["INVOCATION_ID"]}\n',
              encoding='utf-8',
          )
          print(f'Saved {output_path}')
          PY
      - name: Publish browser-readable image mirror
        env:
          IMAGE_PATH: generated_${{ inputs.width }}x${{ inputs.height }}.png
          INVOCATION_ID: ${{ inputs.invocation_id }}
        run: |
          set -euo pipefail
          git config user.name 'ForgeClaw Image Generator'
          git config user.email 'forgeclaw-image@local'
          git fetch origin main generated-images || true
          rm -rf /tmp/generated-images-worktree
          if git show-ref --verify --quiet refs/remotes/origin/generated-images; then
            git worktree add /tmp/generated-images-worktree origin/generated-images
            git -C /tmp/generated-images-worktree checkout -B generated-images
          else
            git worktree add --detach /tmp/generated-images-worktree origin/main
            git -C /tmp/generated-images-worktree checkout --orphan generated-images
            git -C /tmp/generated-images-worktree rm -rf . || true
          fi
          mkdir -p /tmp/generated-images-worktree/generated-images
          cp "$IMAGE_PATH" "/tmp/generated-images-worktree/generated-images/${INVOCATION_ID}.png"
          git -C /tmp/generated-images-worktree add "generated-images/${INVOCATION_ID}.png"
          git -C /tmp/generated-images-worktree commit -m "image: publish ${INVOCATION_ID}"
          git -C /tmp/generated-images-worktree push origin HEAD:generated-images
      - name: Upload generated artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-image-${{ inputs.invocation_id }}
          path: |
            generated_*.png
            generation_metadata.txt
          if-no-files-found: error
          retention-days: 7
