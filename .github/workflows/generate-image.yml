# Repository-owned image generation, model-swappable through .github/scripts/generate_image.py.
# Default: Stable Diffusion 1.5 (public, CPU-compatible, no HF_TOKEN or gated approval).
# Opt-in: sdxl-turbo (staged loading) and sd-turbo. See the script for per-model licence notes.
name: Generate Image
run-name: Generate Image ${{ inputs.invocation_id }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Image description
        required: true
        type: string
      style:
        description: Style such as realistic, artistic, or cartoon
        required: false
        default: realistic
        type: string
      width:
        description: Width in pixels; must be 256-1024 and divisible by 8
        required: false
        default: '512'
        type: string
      height:
        description: Height in pixels; must be 256-1024 and divisible by 8
        required: false
        default: '512'
        type: string
      model:
        description: 'Model key: sd15 (default), sdxl-turbo or sd-turbo; Turbo models are 512x512 max'
        required: false
        default: sd15
        type: string
      invocation_id:
        description: Correlation identifier
        required: true
        type: string
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: image-models-${{ runner.os }}-${{ inputs.model || 'sd15' }}-${{ hashFiles('.github/workflows/generate-image.yml', '.github/scripts/generate_image.py', '.github/requirements-image.txt') }}
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.1+cpu torchvision==0.29.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r .github/requirements-image.txt
      - name: Generate image
        env:
          PROMPT: ${{ inputs.prompt }}
          STYLE: ${{ inputs.style }}
          WIDTH: ${{ inputs.width }}
          HEIGHT: ${{ inputs.height }}
          MODEL: ${{ inputs.model }}
          INVOCATION_ID: ${{ inputs.invocation_id }}
        run: python .github/scripts/generate_image.py
      - name: Publish browser-readable image mirror
        env:
          IMAGE_PATH: generated_${{ inputs.width }}x${{ inputs.height }}.png
          INVOCATION_ID: ${{ inputs.invocation_id }}
        run: |
          set -euo pipefail
          git config user.name 'ForgeClaw Image Generator'
          git config user.email 'forgeclaw-image@local'
          git fetch origin main generated-images || true
          rm -rf /tmp/generated-images-worktree
          if git show-ref --verify --quiet refs/remotes/origin/generated-images; then
            git worktree add /tmp/generated-images-worktree origin/generated-images
            git -C /tmp/generated-images-worktree checkout -B generated-images
          else
            git worktree add --detach /tmp/generated-images-worktree origin/main
            git -C /tmp/generated-images-worktree checkout --orphan generated-images
            git -C /tmp/generated-images-worktree rm -rf . || true
          fi
          mkdir -p /tmp/generated-images-worktree/generated-images
          cp "$IMAGE_PATH" "/tmp/generated-images-worktree/generated-images/${INVOCATION_ID}.png"
          git -C /tmp/generated-images-worktree add "generated-images/${INVOCATION_ID}.png"
          git -C /tmp/generated-images-worktree commit -m "image: publish ${INVOCATION_ID}"
          # Two runs finishing together race on this branch (non-fast-forward). Rebase onto the
          # newest tip and retry instead of failing the step, which would also skip the artifact upload.
          for attempt in 1 2 3 4 5; do
            if git -C /tmp/generated-images-worktree push origin HEAD:generated-images; then exit 0; fi
            echo "Mirror push attempt ${attempt} failed; rebasing onto the latest generated-images tip."
            git -C /tmp/generated-images-worktree fetch origin generated-images
            git -C /tmp/generated-images-worktree rebase origin/generated-images
            sleep $((attempt * 3))
          done
          echo '::error::Could not publish the image mirror after 5 attempts (the artifact upload below still runs).'
          exit 1
      - name: Upload generated artifact
        # Run even if the mirror push failed, so the image stays retrievable through the artifact path.
        if: ${{ always() && hashFiles('generated_*.png') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-image-${{ inputs.invocation_id }}
          path: |
            generated_*.png
            generation_metadata.txt
            generation_meta.json
          if-no-files-found: error
          retention-days: 7
