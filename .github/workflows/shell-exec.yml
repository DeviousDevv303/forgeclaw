# ForgeClaw Shell Execution workflow. Inputs are passed through environment variables
# so shell metacharacters cannot corrupt the workflow YAML/script itself.

name: ForgeClaw Shell Execution
run-name: Shell exec ${{ inputs.invocation_id }}

on:
  workflow_dispatch:
    inputs:
      command:
        description: Shell command approved by ForgeClaw
        required: true
        type: string
      working_directory:
        description: Repository-relative working directory
        required: true
        default: .
        type: string
      invocation_id:
        description: ForgeClaw invocation identifier used to correlate the run
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute command
        id: shell_exec
        env:
          FORGE_COMMAND: ${{ inputs.command }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set +e
          echo "=== FORGECLAW EXECUTION ==="
          echo "invocation_id=${{ inputs.invocation_id }}"
          echo "start=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          WORKSPACE_ROOT="$(realpath -e "$GITHUB_WORKSPACE")"
          if [[ "$WORKING_DIRECTORY" = /* ]]; then
            echo "working_directory must be repository-relative"
            EXIT_CODE=2
          else
            TARGET_DIRECTORY="$(realpath -m -- "$WORKSPACE_ROOT/$WORKING_DIRECTORY")"
            case "$TARGET_DIRECTORY" in
              "$WORKSPACE_ROOT"|"$WORKSPACE_ROOT"/*)
                if [[ ! -d "$TARGET_DIRECTORY" ]]; then
                  echo "working_directory does not exist: $WORKING_DIRECTORY"
                  EXIT_CODE=2
                else
                  cd -- "$TARGET_DIRECTORY"
                  bash -c "$FORGE_COMMAND"
                  EXIT_CODE=$?
                fi
                ;;
              *)
                echo "working_directory escapes GITHUB_WORKSPACE: $WORKING_DIRECTORY"
                EXIT_CODE=2
                ;;
            esac
          fi
          echo "exit_code=$EXIT_CODE"
          echo "end=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          exit $EXIT_CODE
