name: ForgeClaw Shell Execution

run-name: Shell exec ${{ inputs.invocation_id }}

on:
  workflow_dispatch:
    inputs:
      command:
        description: Shell command approved by ForgeClaw
        required: true
        type: string
      working_directory:
        description: Repository-relative working directory
        required: true
        default: .
        type: string
      invocation_id:
        description: ForgeClaw invocation identifier used to correlate the run
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Hardening: the arbitrary command below should find no credential in .git/config.
          persist-credentials: false

      - name: Execute command
        env:
          FORGE_COMMAND: ${{ inputs.command }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          FORGE_INVOCATION_ID: ${{ inputs.invocation_id }}
        run: |
          set +e
          echo "=== FORGECLAW EXECUTION ==="
          echo "invocation_id=$FORGE_INVOCATION_ID"
          echo "start=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          WORKSPACE_ROOT="$(realpath -e "$GITHUB_WORKSPACE")"
          if [[ "$WORKING_DIRECTORY" = /* ]]; then
            echo "working_directory must be repository-relative"
            EXIT_CODE=2
          else
            TARGET_DIRECTORY="$(realpath -m -- "$WORKSPACE_ROOT/$WORKING_DIRECTORY")"
            case "$TARGET_DIRECTORY" in
              "$WORKSPACE_ROOT"|"$WORKSPACE_ROOT"/*)
                if [[ ! -d "$TARGET_DIRECTORY" ]]; then
                  echo "working_directory does not exist: $WORKING_DIRECTORY"
                  EXIT_CODE=2
                else
                  cd -- "$TARGET_DIRECTORY"
                  # pipefail: a failing stage of a pipeline (git clone ... | tail) must not be masked by the last stage.
                  bash -o pipefail -c "$FORGE_COMMAND"
                  EXIT_CODE=$?
                  # With pipefail, `producer | head` exits 141 (SIGPIPE) when head closes the pipe early. That is
                  # the pipeline working as intended, not a failure, so it is reported as 0 and said so in the log.
                  if [[ "$EXIT_CODE" -eq 141 ]]; then
                    echo "note: command exited 141 (SIGPIPE: a downstream stage such as head closed the pipe early); reported as exit_code=0"
                    EXIT_CODE=0
                  fi
                fi
                ;;
              *)
                echo "working_directory escapes GITHUB_WORKSPACE: $WORKING_DIRECTORY"
                EXIT_CODE=2
                ;;
            esac
          fi
          echo "exit_code=$EXIT_CODE"
          echo "end=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          exit $EXIT_CODE
