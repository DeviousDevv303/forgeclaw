name: ForgeClaw Shell Execution

on:
  workflow_dispatch:
    inputs:
      command:
        description: Shell command approved by ForgeClaw
        required: true
        type: string
      working_directory:
        description: Repository-relative working directory
        required: false
        default: .
        type: string
      invocation_id:
        description: ForgeClaw invocation identifier
        required: true
        type: string

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute command
        run: |
          set +e
          cd "${{ inputs.working_directory }}"
          echo "=== FORGECLAW EXECUTION ==="
          echo "invocation_id=${{ inputs.invocation_id }}"
          echo "start=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash -c "${{ inputs.command }}"
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE"
          echo "end=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          exit $EXIT_CODE
