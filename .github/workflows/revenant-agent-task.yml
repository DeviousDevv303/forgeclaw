name: Revenant Agent Task
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Coding task description"
        required: true
        type: string
      base_branch:
        description: "Branch to base work on"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  revenant-run:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim@sha256:174bec68e0451bffabbb08c7d5d21c6b253f772d81d52b9558af97bb3159b761
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.base_branch }}

      - name: Report lockfile SHA256 for manual verification
        run: |
          echo "Lockfile SHA256:"
          sha256sum .github/agent-task/requirements.lock

      - name: Install Revenant (hash-pinned)
        run: |
          python -m pip install --require-hashes \
            -r .github/agent-task/requirements.lock

      - name: Install Ollama (external, not hash-pinned)
        run: |
          apt-get update
          apt-get install -y curl
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama and pull model
        run: |
          ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if ollama list >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          if ! ollama list >/dev/null 2>&1; then
            cat /tmp/ollama.log
            exit 1
          fi
          ollama pull qwen2.5-coder:1.5b
          ollama list

      - name: Run Revenant
        id: revenant
        continue-on-error: true
        env:
          OLLAMA_HOST: http://127.0.0.1:11434
          REVENANT_TASK: ${{ inputs.task }}
        run: |
          revenant --workspace . --model qwen2.5-coder:1.5b --yolo "$REVENANT_TASK"

      - name: Record Revenant outcome
        run: |
          echo "Revenant step outcome: ${{ steps.revenant.outcome }}"

      - name: Capture output
        run: |
          git diff > /tmp/revenant.diff
          git status --short > /tmp/revenant.status
          echo "--- git diff stat ---"
          git diff --stat
          echo "--- ollama list (model identity) ---"
          ollama list
          echo "--- revenant step outcome ---"
          echo "${{ steps.revenant.outcome }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: revenant-output
          path: |
            /tmp/revenant.diff
            /tmp/revenant.status
