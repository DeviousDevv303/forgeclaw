name: Analyze Image

# Vision analysis with Qwen2-VL-2B-Instruct on the CPU runner. The logic lives in
# .github/scripts/analyze_image.py (validated and unit-tested); failures are printed as ::error::
# annotations. The result is uploaded as the artifact image-analysis-<invocation_id> (1 day).
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'https URL of the image to analyze'
        required: true
      prompt:
        description: 'What to analyze'
        default: 'Describe this image in detail'
      invocation_id:
        description: 'Unique ID for this request'
        required: true

run-name: Analyze Image ${{ inputs.invocation_id }}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qwen2-vl-2b-${{ runner.os }}-v2
      - name: Install deps (exact pins)
        run: |
          pip install torch==2.14.1+cpu torchvision==0.29.1+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r .github/requirements-vision.txt
      - name: Analyze
        env:
          IMAGE_URL: ${{ inputs.image_url }}
          PROMPT: ${{ inputs.prompt }}
        run: python .github/scripts/analyze_image.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-analysis-${{ inputs.invocation_id }}
          path: |
            result.txt
            result_meta.txt
          if-no-files-found: ignore
          retention-days: 1
