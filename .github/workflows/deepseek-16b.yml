# Directive item 1 — DeepSeek primary reasoning workflow.
#
# Truthfulness: the route/API name is "DeepSeek 16B" for continuity, but the
# checkpoint that actually runs is a public DeepSeek instruct model. The
# original deepseek-coder-16b-instruct identifier is not a public Hugging Face
# model, and this runner is CPU-only. `result_meta.txt` always records the exact
# checkpoint that produced the result, so the UI never has to guess.
#
# Reliability: the primary general-chat checkpoint (7B) is a genuine memory
# risk on a 16 GB CPU runner. If it cannot be loaded or executed, the workflow
# falls back to the smaller public DeepSeek checkpoint rather than failing the
# run. The DeepSeek role, dispatch contract, artifact contract and mirror
# contract stay identical in both cases.
#
# Delivery: the result is published twice.
#   1. a plain-text mirror on the `deepseek-results` branch, served by
#      raw.githubusercontent.com — CORS-safe and directly readable from the
#      deployed GitHub Pages browser (same pattern as generated-images);
#   2. an uploaded artifact (`deepseek-<invocation_id>`) as the durable fallback.

name: DeepSeek 16B
run-name: DeepSeek 16B ${{ inputs.invocation_id }}

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task for the DeepSeek reasoning workflow
        required: true
        type: string
      context:
        description: Additional context
        required: false
        default: ''
        type: string
      nexus_learning:
        description: Record this request for NEXUS learning
        required: false
        default: 'true'
        type: string
      invocation_id:
        description: Correlation identifier
        required: true
        type: string

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Fast engine: a 4-bit GGUF (about 4 GB) of the same DeepSeek 7B chat model, run by llama.cpp.
      # The cache is restored here and saved only after the file is confirmed present, so a run that fell
      # back to the slow engine can never poison the key with an empty directory. The old 14 GB float16
      # cache is deliberately not restored (it cost 2-4 minutes per run); the slow fallback downloads on demand.
      - name: Restore GGUF model cache
        id: gguf_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/forgeclaw-gguf
          key: deepseek-gguf-v1-${{ runner.os }}

      - name: Install inference dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers accelerate
          # Prebuilt CPU wheel (no compiling). If it is unavailable the run continues on the slow engine.
          pip install llama-cpp-python==0.3.36 --only-binary=llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            || echo "::warning::llama-cpp-python wheel unavailable; DeepSeek will use the slow transformers engine"

      - name: Run DeepSeek
        env:
          TASK: ${{ inputs.task }}
          CONTEXT: ${{ inputs.context }}
          INVOCATION_ID: ${{ inputs.invocation_id }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          import time
          import torch
          # Stops the model narrating results for a tool call it only requested.
          sys.path.insert(0, '.github/scripts')
          from deepseek_tool_calls import normalize_tool_call_output
          import deepseek_gguf
          from transformers import AutoModelForCausalLM, AutoTokenizer

          # Use DeepSeek's general conversational checkpoint for the primary
          # reasoner; the code-specialized Coder model repeatedly refused safe
          # creative requests even after a same-model retry.
          # The fallback remains a smaller DeepSeek Instruct checkpoint, used
          # only when the primary cannot run on this CPU runner.
          PRIMARY_MODEL = 'deepseek-ai/deepseek-llm-7b-chat'
          FALLBACK_MODEL = 'deepseek-ai/deepseek-coder-1.3b-instruct'

          task = os.environ['TASK'].strip()
          context = os.environ.get('CONTEXT', '').strip()
          invocation_id = os.environ['INVOCATION_ID']

          torch.set_num_threads(min(4, os.cpu_count() or 1))

          def is_presentation_task(task_text):
              return 'presentation' in task_text.casefold()

          # Only include the presentation template for actual presentation tasks.
          # The 7B model latches onto structured templates and ignores the real task.
          presentation_instructions = (
              ' For a presentation request, write the presentation itself with a title and '
              'the exact sections Opening Image, What We Can See, What Light Means, '
              'and Closing Invitation. Do not use a letter greeting or name placeholder. '
          ) if is_presentation_task(task) else ''

          user_content = (
              f"Task:\n{task}\n\nVerified project, CORPUS, and tool context:\n"
              f"{context or '(No additional context was supplied.)'}\n\n"
              'Answer the actual task directly and concretely from the supplied '
              'context. Distinguish static architecture facts from live repository '
              'facts. This workflow has no direct tool authority: never claim a '
              'tool, workflow, repository read, or other action happened unless an '
              'actual successful ForgeTools result or correlated run result is '
              'included above. Results marked [TOOL ERROR], [GUARDIAN BLOCK], or '
              '[GUARDIAN REJECTED] are failures, not proof of successful execution. '
              'If the context is sufficient, do not refuse merely because the task '
              'names ForgeClaw or another specific project. Answer technical, '
              'factual, analytical, and creative requests directly when the supplied '
              'information supports it. For spiritual, philosophical, persuasive, or '
              'creative requests, treat the premise as a poetic or imaginative frame '
              'rather than scientifically proven fact, but still fulfill the requested '
              f'artifact instead of replacing it with a generic disclaimer.{presentation_instructions}'
              'Honor ForgeClaw\'s '
              'motive of Love: invite reflection without exploiting vulnerabilities '
              'or using coercive emotional pressure. If evidence is missing, name '
              'precisely what cannot be verified rather than guessing.'
          )
          messages = [
              {
                  'role': 'system',
                  'content': (
                  'You are the primary reasoning engine of ForgeClaw. Answer the '
                  'user’s actual request on its merits using the supplied context; '
                  'technical, factual, analytical, and creative requests are all in '
                  'scope. For safe philosophical, spiritual, persuasive, or creative '
                  'requests, label an unsupported premise briefly as metaphor or belief '
                  'when needed, then still produce the actual requested artifact. Do '
                  'not replace safe creative work with a claim that you are not equipped, '
                  'a redirect to another source, or a technical lecture. If the user '
                  'asks for emotional triggers, replace exploitation of private '
                  'vulnerabilities with an ethical persuasive arc based on universal '
                  'human experiences and an invitation that preserves consent.'
                  + presentation_instructions +
                  ' Never claim an action succeeded without actual evidence.'
                  ' When you need to invoke a tool, emit a structured tool call '
                  'in this exact format:\n\n'
                  '```tool_call\n'
                  '{"name": "tool_name", "arguments": {"key": "value"}}\n'
                  '```\n\n'
                  'Available tools: github_read_file (path), github_list_files (path), '
                  'github_search_code (query), github_repo_state (), '
                  'github_write_file (path, content, branch), '
                  'shell_exec (command, working_directory; runs read-only in a checkout of the repository), '
                  'web_search (query, count), memory_read (key), memory_write (key, value). '
                  'Use only these names; never invent a tool. Emit ONE tool call and then STOP: '
                  'you cannot see its result, the orchestrator runs it and sends you the real '
                  'output. Never write what a tool returned, never write "(output: ...)" and '
                  'never say you executed anything. Do not describe the tool call in prose; '
                  'emit the structured format above so the orchestrator can execute it.'
                  ),
              },
              {'role': 'user', 'content': user_content},
          ]

          def is_creative_task(task_text):
              folded = task_text.casefold()
              markers = ('creative', 'presentation', 'persuasive', 'philosoph', 'spiritual', 'metaphor', 'poem', 'story', 'imagine')
              return any(marker in folded for marker in markers)

          def has_presentation_structure(text):
              folded = ' '.join(text.casefold().split())
              sections = ('opening image', 'what we can see', 'what light means', 'closing invitation')
              return all(section in folded for section in sections)

          def clean_model_output(text):
              # The captured 7B-Chat artifact contains byte-level vocabulary
              # markers (Ġ for spaces and Ċ for line breaks) verbatim. Normalize
              # only when their density strongly indicates a leaked token stream.
              marker_count = text.count('Ġ') + text.count('Ċ')
              cleanup_applied = marker_count >= max(3, len(text) // 100)
              if cleanup_applied:
                  text = text.replace('Ġ', ' ').replace('Ċ', '\n')
              before_placeholders = text
              text = re.sub(r'[ \t]{2,}', ' ', text)
              text = re.sub(r'\[(?:USER_NAME|USERNAME)\]', '', text, flags=re.IGNORECASE)
              text = re.sub(r'(?im)^\s*Dear\s*,?[ \t]*(?:\r?\n)+', '', text)
              text = re.sub(r'(?im)^Best regards,[ \t]*\r?\n(?:[ \t]*\r?\n)*[ \t]*ForgeClaw[ \t]*$', '', text)
              cleanup_applied = cleanup_applied or text != before_placeholders
              return text.strip(), cleanup_applied

          def is_generic_scope_refusal(text):
              folded = ' '.join(text.casefold().split())
              markers = (
                  'not equipped to engage in philosophical, spiritual, or creative discussions',
                  'not equipped to provide a presentation that would convince',
                  "i'm not equipped to engage in philosophical",
                  'i am not equipped to engage in philosophical',
                  'seek help from a source that specializes in these areas',
              )
              return any(marker in folded for marker in markers)

          loaded_models = {}

          # ---- fast engine: llama.cpp + 4-bit GGUF of the same primary model -------------------------
          GGUF_DIR = os.path.expanduser('~/.cache/forgeclaw-gguf')
          FAST_TIME_BUDGET_S = 420  # a partial answer is returned (and flagged) rather than waiting longer
          fast = {'llm': None, 'failed': False, 'file': None, 'load_s': 0.0, 'tokens': 0, 'gen_s': 0.0,
                  'timed_out': False, 'trimmed': False, 'version': None, 'error': None}

          def fast_engine():
              if os.environ.get('DEEPSEEK_ENGINE', 'gguf') == 'hf' or fast['failed']:
                  return None
              if fast['llm'] is None:
                  try:
                      import llama_cpp
                      from huggingface_hub import hf_hub_download, list_repo_files
                      t0 = time.time()
                      llm, file_name = deepseek_gguf.load_model(
                          GGUF_DIR, list_repo_files,
                          lambda repo, name, local_dir: hf_hub_download(repo_id=repo, filename=name, local_dir=local_dir),
                          llama_cpp.Llama,
                      )
                      fast.update(llm=llm, file=file_name, load_s=round(time.time() - t0, 1),
                                  version=getattr(llama_cpp, '__version__', 'unknown'))
                      print(f'Fast engine ready: {file_name} (llama-cpp-python {fast["version"]}) in {fast["load_s"]}s')
                  except Exception as error:  # noqa: BLE001 - any failure means: use the slow engine
                      fast.update(failed=True, error=f'{type(error).__name__}: {error}'[:300])
                      print(f'Fast engine unavailable ({fast["error"]}); using the transformers engine.')
                      return None
              return fast['llm']

          def run_fast(llm, active_messages, max_new_tokens):
              system_text = '\n\n'.join(m['content'] for m in active_messages if m['role'] == 'system')
              user_text = '\n\n'.join(m['content'] for m in active_messages if m['role'] == 'user')
              prompt = deepseek_gguf.build_prompt(system_text, user_text)
              budget = deepseek_gguf.N_CTX - max_new_tokens - 16
              prompt, trimmed = deepseek_gguf.fit_text(
                  prompt, lambda text: len(llm.tokenize(text.encode('utf-8'), add_bos=False)), budget)
              stream = llm.create_completion(prompt, max_tokens=max_new_tokens, temperature=0.0,
                                             stop=deepseek_gguf.STOP, stream=True)
              text, tokens, seconds, timed_out = deepseek_gguf.generate(stream, max_new_tokens, FAST_TIME_BUDGET_S)
              fast['tokens'] += tokens
              fast['gen_s'] = round(fast['gen_s'] + seconds, 1)
              fast['timed_out'] = fast['timed_out'] or timed_out
              fast['trimmed'] = fast['trimmed'] or trimmed
              print(f'Fast engine: {tokens} tokens in {seconds}s (timed_out={timed_out}, trimmed={trimmed})')
              return text

          def run_inference(model_id, active_messages=None, max_new_tokens=768):
              active_messages = active_messages or messages
              if model_id == PRIMARY_MODEL:
                  llm = fast_engine()
                  if llm is not None:
                      try:
                          return run_fast(llm, active_messages, max_new_tokens)
                      except Exception as error:  # noqa: BLE001
                          fast.update(failed=True, error=f'generation: {type(error).__name__}: {error}'[:300])
                          print(f'Fast engine failed during generation ({fast["error"]}); using the transformers engine.')
              loaded = loaded_models.get(model_id)
              if loaded is None:
                  tokenizer = AutoTokenizer.from_pretrained(model_id)
                  model = AutoModelForCausalLM.from_pretrained(
                      model_id,
                      torch_dtype=torch.float16,
                      low_cpu_mem_usage=True,
                  )
                  model.eval()
                  loaded_models[model_id] = (tokenizer, model)
              else:
                  tokenizer, model = loaded
              if model_id == PRIMARY_MODEL:
                  # The official DeepSeek-LLM 7B Chat model card warns that
                  # system-role messages are not compatible with this model.
                  # Preserve the separation in plain text but send one user turn.
                  system_text = '\n\n'.join(
                      message['content'] for message in active_messages
                      if message['role'] == 'system'
                  )
                  user_text = '\n\n'.join(
                      message['content'] for message in active_messages
                      if message['role'] == 'user'
                  )
                  active_messages = [{
                      'role': 'user',
                      'content': f'ForgeClaw instructions and context:\n{system_text}\n\n{user_text}',
                  }]
              if getattr(tokenizer, 'chat_template', None):
                  encoded = tokenizer.apply_chat_template(
                      active_messages,
                      add_generation_prompt=True,
                      return_tensors='pt',
                      return_dict=True,
                  )
              else:
                  prompt = '\n\n'.join(
                      f"{message['role'].capitalize()}:\n{message['content']}"
                      for message in active_messages
                  ) + '\n\nAssistant:\n'
                  encoded = tokenizer(prompt, return_tensors='pt', truncation=True, max_length=4096)
              with torch.no_grad():
                  output = model.generate(
                      **encoded,
                      max_new_tokens=max_new_tokens,
                      max_time=600,
                      do_sample=False,
                      pad_token_id=tokenizer.eos_token_id,
                  )
              generated = output[0][encoded['input_ids'].shape[1]:]
              return tokenizer.decode(generated, skip_special_tokens=True).strip()

          model_used = PRIMARY_MODEL
          note = 'primary checkpoint'
          started = time.time()
          try:
              result = run_inference(PRIMARY_MODEL)
          except Exception as primary_error:  # noqa: BLE001 - any load/run failure is a fallback trigger
              print(f'Primary checkpoint unavailable ({type(primary_error).__name__}: {primary_error}); '
                    f'falling back to {FALLBACK_MODEL}')
              model_used = FALLBACK_MODEL
              note = f'fallback checkpoint after primary failure: {type(primary_error).__name__}'
              result = run_inference(FALLBACK_MODEL)

          result, output_cleanup_applied = clean_model_output(result)
          result, tool_call_tail_dropped = normalize_tool_call_output(result)

          creative_retry_attempted = False
          creative_retry_succeeded = False
          needs_creative_retry = is_creative_task(task) and (
              is_generic_scope_refusal(result)
              or (is_presentation_task(task) and not has_presentation_structure(result))
          )
          if needs_creative_retry:
              creative_retry_attempted = True
              retry_messages = [
                  {
                      'role': 'system',
                      'content': messages[0]['content'] + (
                          ' A prior draft incorrectly refused a safe creative task. This is a '
                          'bounded retry using the same primary model, not a request to claim '
                          'unsupported facts. Treat the premise as an imaginative metaphor, '
                          'briefly label it as such, then deliver the requested artifact. If '
                          'the requested persuasion mentions inner triggers, replace that '
                          'method with an ethical appeal to universal human experiences and '
                          'free choice. Do not say you are unequipped or redirect the user. '
                          'Write a concise presentation now with a title and these exact headings: '
                          'Opening Image; What We Can See; What Light Means; Closing Invitation. '
                          'Use 1–3 concrete sentences under each heading, no greeting, and do not '
                          'explain these instructions.'
                      ),
                  },
                  {'role': 'user', 'content': user_content},
              ]
              print('Primary output missed the requested creative/presentation quality gate; retrying once with the same checkpoint and explicit artifact structure.')
              try:
                  retry_result = run_inference(model_used, retry_messages, max_new_tokens=512)
                  retry_result, retry_cleanup_applied = clean_model_output(retry_result)
                  retry_result, _ = normalize_tool_call_output(retry_result)
                  retry_is_useful = bool(retry_result) and not is_generic_scope_refusal(retry_result)
                  if is_presentation_task(task):
                      retry_is_useful = retry_is_useful and has_presentation_structure(retry_result)
                  if retry_is_useful:
                      result = retry_result
                      creative_retry_succeeded = True
                      output_cleanup_applied = retry_cleanup_applied
                  else:
                      print('The bounded same-model retry did not produce a substantive creative response; preserving the actual primary output.')
              except Exception as retry_error:  # noqa: BLE001 - preserve the real primary output if retry itself fails
                  print(f'Creative-scope retry failed ({type(retry_error).__name__}); preserving the actual primary output.')

          elapsed = round(time.time() - started, 1)

          degraded = model_used != PRIMARY_MODEL
          if not result:
              result = '(DeepSeek produced an empty response)'
          elif degraded:
              # Make the downgrade impossible to miss: the answer text itself carries the warning.
              result = (
                  f'\u26a0 DEGRADED ANSWER: the primary model ({PRIMARY_MODEL}) failed ({note}); '
                  f'this reply came from the much smaller fallback {FALLBACK_MODEL} and may be wrong. '
                  'Do not rely on it without checking.\n\n' + result
              )

          with open('result.txt', 'w', encoding='utf-8') as handle:
              handle.write(result)
          with open('result_meta.txt', 'w', encoding='utf-8') as handle:
              handle.write(
                  f'invocation_id={invocation_id}\n'
                  f'model={model_used}\n'
                  f'role={note}\n'
                  f'degraded={str(degraded).lower()}\n'
                  f'creative_retry_attempted={str(creative_retry_attempted).lower()}\n'
                  f'creative_retry_succeeded={str(creative_retry_succeeded).lower()}\n'
                  f'output_cleanup_applied={str(output_cleanup_applied).lower()}\n'
                  f'tool_call_tail_dropped={str(tool_call_tail_dropped).lower()}\n'
                  f'elapsed_seconds={elapsed}\n'
                  + (
                      f'engine=llama.cpp GGUF {deepseek_gguf.QUANT.upper()} ({deepseek_gguf.GGUF_REPO}/{fast["file"]}) of {PRIMARY_MODEL}\n'
                      f'engine_load_seconds={fast["load_s"]}\n'
                      f'generated_tokens={fast["tokens"]}\n'
                      f'generation_seconds={fast["gen_s"]}\n'
                      f'stopped_by_time_budget={str(fast["timed_out"]).lower()}\n'
                      f'prompt_trimmed={str(fast["trimmed"]).lower()}\n'
                      f'llama_cpp_python={fast["version"]}\n'
                      if fast['llm'] is not None and not fast['failed'] and model_used == PRIMARY_MODEL else
                      'engine=transformers float16 (slow fallback)\n'
                      f'fast_engine_error={fast["error"] or "not attempted"}\n'
                  )
              )
          print(f'Wrote DeepSeek result for {invocation_id} using {model_used}')
          PY

      - name: Publish browser-readable result mirror
        continue-on-error: true
        env:
          INVOCATION_ID: ${{ inputs.invocation_id }}
        run: |
          set -euo pipefail
          git config user.name 'ForgeClaw DeepSeek Runner'
          git config user.email 'forgeclaw-deepseek@local'
          git fetch origin main deepseek-results || true
          rm -rf /tmp/deepseek-results-worktree
          if git show-ref --verify --quiet refs/remotes/origin/deepseek-results; then
            git worktree add /tmp/deepseek-results-worktree origin/deepseek-results
            git -C /tmp/deepseek-results-worktree checkout -B deepseek-results
          else
            git worktree add --detach /tmp/deepseek-results-worktree origin/main
            git -C /tmp/deepseek-results-worktree checkout --orphan deepseek-results
            git -C /tmp/deepseek-results-worktree rm -rf . || true
          fi
          mkdir -p /tmp/deepseek-results-worktree/deepseek-results
          cp result.txt "/tmp/deepseek-results-worktree/deepseek-results/${INVOCATION_ID}.txt"
          cp result_meta.txt "/tmp/deepseek-results-worktree/deepseek-results/${INVOCATION_ID}.meta.txt"
          git -C /tmp/deepseek-results-worktree add "deepseek-results/${INVOCATION_ID}.txt" "deepseek-results/${INVOCATION_ID}.meta.txt"
          git -C /tmp/deepseek-results-worktree commit -m "deepseek: publish ${INVOCATION_ID}"
          # Concurrent runs push to the same branch; on a rejected push, rebase onto the new tip and retry.
          for attempt in 1 2 3 4; do
            if git -C /tmp/deepseek-results-worktree push origin HEAD:deepseek-results; then break; fi
            if [ "$attempt" = 4 ]; then echo "::warning::mirror push failed after 4 attempts; the artifact remains the fallback"; exit 1; fi
            git -C /tmp/deepseek-results-worktree fetch origin deepseek-results
            git -C /tmp/deepseek-results-worktree rebase origin/deepseek-results
            sleep $((attempt * 2))
          done

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-${{ inputs.invocation_id }}
          path: |
            result.txt
            result_meta.txt
          if-no-files-found: error
          retention-days: 7

      - name: Check GGUF file is present
        id: gguf_present
        if: ${{ steps.gguf_cache.outputs.cache-hit != 'true' }}
        run: |
          if ls ~/.cache/forgeclaw-gguf/*.gguf >/dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Save GGUF model cache
        if: ${{ steps.gguf_cache.outputs.cache-hit != 'true' && steps.gguf_present.outputs.present == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/forgeclaw-gguf
          key: deepseek-gguf-v1-${{ runner.os }}
