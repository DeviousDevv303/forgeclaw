# Cloudflare Worker config for the ForgeClaw public relay. See relay/README.md.
name = "forgeclaw-relay"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
REPO = "DeviousDevv303/forgeclaw"
ALLOWED_ORIGINS = "https://deviousdevv303.github.io"
MAX_PER_HOUR = "10"
MAX_CONCURRENT = "3"

# Per-IP hourly quota. Create it with: npx wrangler kv namespace create RATE
# then paste the id it prints here.
# [[kv_namespaces]]
# binding = "RATE"
# id = "<paste id>"
